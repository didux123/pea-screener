[project]
name = "pea"
version = "0.1.0"
description = "Screener PEA : univers, données, score composite, dossiers d'investissement, portefeuille fictif"
requires-python = ">=3.12"
dependencies = [
    "yfinance==1.7.0",
    "duckdb==1.5.5",
    "pandas>=2.2",
    "pyarrow>=17",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    # Lot 2 : dossiers d'investissement
    "litellm>=1.100",
    "pydantic>=2.11",
]

[project.scripts]
pea = "pea.cli:main"

[dependency-groups]
# pyyaml sert à lire la route Traefik dans les tests de déploiement. Il arrive par
# transitivité avec litellm, mais on le déclare pour ne pas dépendre de ce hasard.
dev = ["pytest>=8", "ruff>=0.6", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pea"]

[tool.hatch.build.targets.wheel.force-include]
"pea/web" = "pea/web"
"pea/templates" = "pea/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests qui appellent Yahoo (ignorés par défaut)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Erreurs de syntaxe, imports et variables inutilisés, tri des imports, pièges courants.
# Les horodatages naïfs sont voulus : DuckDB stocke des TIMESTAMP sans fuseau et tout
# passe par pea.db.now_utc(), qui produit de l'UTC.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "SIM108"]
