[project]
name = "pea"
version = "0.1.0"
description = "Screener PEA : univers, données, score composite, dossiers d'investissement, portefeuille fictif"
requires-python = ">=3.12"
dependencies = [
    "yfinance==1.7.0",
    "duckdb==1.5.5",
    "pandas>=2.2",
    "pyarrow>=17",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.scripts]
pea = "pea.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pea"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests qui appellent Yahoo (ignorés par défaut)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py312"
